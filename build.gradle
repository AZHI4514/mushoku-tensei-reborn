plugins {
    id 'net.neoforged.moddev' version '2.0.148'
}

group = 'com.azhi.mushoku'
version = '0.1.0'

java.toolchain {
    languageVersion = JavaLanguageVersion.of(21)
    vendor = JvmVendorSpec.ADOPTIUM
}

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven { url = uri('https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/') }
        }
        filter { includeGroup 'software.bernie.geckolib' }
    }
}

sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}

dependencies {
    implementation 'software.bernie.geckolib:geckolib-neoforge-1.21.1:4.7.7'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test { useJUnitPlatform() }

neoForge {
    version = '21.1.267'
    runs {
        configureEach {
            gameDirectory = file("runs/$name")
        }
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.name
        }
        data {
            data()
            programArguments.addAll '--mod', project.name, '--all',
                '--output', file('src/generated/resources').absolutePath,
                '--existing', file('src/main/resources').absolutePath
        }
    }
    mods {
        mushoku_tensei_reborn {
            sourceSet sourceSets.main
            sourceSet sourceSets.gameTest
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'
tasks.named('processResources') {
    exclude '**/.gitkeep', '.cache/**'
    inputs.property 'modVersion', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand modVersion: project.version
    }
}
